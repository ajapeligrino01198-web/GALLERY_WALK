<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gallery Walk Deck</title>
<style>
/* Layout concept: a 1600x900 stage per slide, scaled to fit, snapped side to side like a gallery wall; red, ink and coin-cream taken from the artwork itself. */
:root{
  --red:#B53931; --deep:#8C2620; --ink:#1A1410; --cream:#F3E8D2; --paper:#FAF5E9; --rose:#E7A39D; --muted:#5A4E44;
  --display:'Playfair Display',Cambria,Georgia,serif; --body:'Source Sans 3',Calibri,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.slide a:focus-visible{outline:3px solid var(--cream);outline-offset:3px}

#deck{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#deck::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100vw;width:100vw;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.slide.red{background:var(--red)} .slide.ink{background:var(--ink)} .slide.paper{background:var(--paper);color:var(--ink)}
.stage{position:absolute;left:50%;top:calc(50% - var(--hud,0px));width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}

/* reveal choreography */
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*.11s)}
.slide.on .rv{opacity:1;transform:none}
.slide .pop{opacity:0;transform:scale(.94) rotate(-1deg);transition:opacity .9s ease .25s,transform .9s cubic-bezier(.2,.8,.2,1) .25s}
.slide.on .pop{opacity:1;transform:none}

/* type */
.kick{font:700 17px var(--body);letter-spacing:.3em;text-transform:uppercase}
h1,h2,h3,.disp{font-family:var(--display);margin:0;font-weight:800;text-wrap:balance}
.it{font-style:italic;font-weight:500}

/* coin badge */
.coin{position:relative;width:var(--d,76px);height:var(--d,76px);border-radius:50%;border:0;padding:0;flex:none;
  background:var(--cf,var(--red));color:var(--ct,var(--cream));box-shadow:0 0 0 3px var(--cr,var(--cream)),inset 0 0 0 8px var(--cf,var(--red)),inset 0 0 0 10px var(--cr,var(--cream));
  font:800 calc(var(--d,76px)*.36) var(--display);display:grid;place-items:center;transition:transform .25s}
.coin:hover{transform:rotate(-8deg) scale(1.08)} .coin.spin{animation:spin .7s ease}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(720deg)}}
.on-paper .coin{--cr:var(--deep)}

/* framed photo */
.frame{background:var(--cream);padding:16px;box-shadow:0 26px 50px rgba(0,0,0,.42);width:max-content}
.frame img{display:block;height:var(--h,650px);width:auto}

/* title */
.s-title .stage{padding:0}
.s-title h1{position:absolute;left:100px;top:170px;font-size:168px;line-height:.88;color:var(--cream)}
.s-title .kick{position:absolute;left:104px;top:96px;color:var(--cream)}
.s-title .tag{position:absolute;left:104px;top:560px;font:italic 500 44px var(--display);color:var(--ink)}
.s-title .stamp{position:absolute;left:104px;top:640px;font:800 20px var(--body);letter-spacing:.28em;border:3px solid var(--cream);padding:12px 20px;color:var(--cream)}
.s-title .names{position:absolute;left:104px;bottom:88px;font:700 26px var(--body);color:var(--cream)}
.s-title .frame{position:absolute;right:120px;top:90px;--h:700px;transform:rotate(2.2deg)}
.s-title.on .frame{animation:float 7s ease-in-out infinite 1.2s}
@keyframes float{50%{transform:rotate(1deg) translateY(-12px)}}
#rain{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#rain i{position:absolute;top:-60px;width:34px;height:34px;border-radius:50%;background:var(--cream);opacity:.16;display:grid;place-items:center;font:800 18px var(--display);color:var(--red);font-style:normal;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(1040px) rotate(300deg)}}

/* artwork */
.s-art .frame{position:absolute;left:120px;top:84px}
.s-art .cap{position:absolute;left:120px;top:782px;width:440px;font:italic 16px var(--body);color:var(--cream);opacity:.85}
.s-art .txt{position:absolute;left:800px;top:90px;width:700px}
.s-art h2{font-size:84px;color:var(--cream)}
.s-art .sub{font:italic 500 30px var(--display);color:var(--rose);margin-top:10px}
.row{display:flex;gap:28px;align-items:flex-start;margin-top:54px}
.row h3{font-size:32px;color:var(--cream)} .row p{margin:8px 0 0;font-size:24px;line-height:1.4;color:#E9DFCB}
.row:hover .coin{transform:rotate(-8deg) scale(1.08)}

/* two levels of meaning */
.s-mean .kick{position:absolute;left:100px;top:60px;color:var(--cream)}
.s-mean h2{position:absolute;left:100px;top:98px;font-size:68px;color:var(--cream);width:1300px}
.s-mean .cols{position:absolute;left:100px;top:196px;width:1400px;height:630px;display:grid;grid-template-columns:520px 1fr;gap:40px}
.mc{padding:36px 40px;display:flex;flex-direction:column;gap:20px;box-shadow:0 18px 34px rgba(0,0,0,.32)}
.mc header{display:flex;gap:24px;align-items:center}
.mc small{display:block;font:700 16px var(--body);letter-spacing:.28em}
.mc h3{font-size:40px;margin-top:2px}
.mc p{margin:0;font-size:22px;line-height:1.45}
.mc.lit{background:var(--cream);color:var(--ink)} .mc.lit small{color:var(--red)} .mc.lit .coin{--cr:var(--deep)}
.mc.con{background:var(--ink);color:var(--cream)} .mc.con small{color:var(--rose)} .mc.con p{color:#E9DFCB}
.chips{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px}
.chips span{border:2px solid var(--red);color:var(--red);padding:8px 16px;font:700 17px var(--body);letter-spacing:.06em;border-radius:999px}
.mc blockquote{margin:auto 0 0;font:italic 500 27px/1.3 var(--display);color:var(--rose)}

/* lenses */
.s-lens .stage{padding:0}
.s-lens h2{position:absolute;left:90px;top:70px;font-size:84px;color:var(--ink)}
.s-lens .sub{position:absolute;left:92px;top:176px;font:italic 500 30px var(--body);color:var(--muted)}
.cards{position:absolute;left:90px;top:262px;display:flex;gap:40px}
.card{width:330px;height:470px;border:0;text-align:left;padding:34px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 28px rgba(0,0,0,.22);transition:transform .3s,box-shadow .3s;color:var(--cream)}
.card:hover{transform:translateY(-12px);box-shadow:0 26px 40px rgba(0,0,0,.3)}
.card.k{background:var(--ink)} .card.r{background:var(--red)}
.card .coin{margin-bottom:42px;--cf:var(--cream);--ct:var(--red);--cr:var(--red)} .card.r .coin{--ct:var(--ink);--cr:var(--ink)}
.card small{font:700 18px var(--body);letter-spacing:.28em}
.card.k small{color:var(--rose)}
.card b{font:800 44px var(--display)} .card em{font:italic 500 27px var(--display)} .card>span:not(.coin){font-size:22px;line-height:1.4;color:#EFE4CF}
.s-lens .foot{position:absolute;left:92px;top:764px;font:italic 800 34px var(--display);color:var(--red)}
.s-lens .hint{position:absolute;right:100px;top:776px;font:600 19px var(--body);color:var(--muted);letter-spacing:.06em}

/* member */
.s-mem .panel{position:absolute;left:0;top:0;width:564px;height:900px;background:var(--red);color:var(--cream)}
.s-mem .kick{position:absolute;left:66px;top:70px;font-size:15px;letter-spacing:.26em}
.s-mem h2{position:absolute;left:66px;top:118px;font-size:76px;color:var(--cream)}
.s-mem .ang{position:absolute;left:66px;top:226px;width:440px;font:italic 500 32px var(--display);color:var(--ink);line-height:1.25}
.qcard{position:absolute;left:66px;top:410px;width:432px;height:420px;border:0;background:var(--ink);color:var(--cream);padding:40px;text-align:left;box-shadow:0 18px 36px rgba(0,0,0,.35);overflow:hidden}
.qcard .q{display:block;font:italic 500 33px/1.3 var(--display);opacity:0;transform:translateY(14px);transition:.6s}
.qcard .mark{position:absolute;left:40px;top:22px;font:800 90px var(--display);color:var(--red);line-height:1}
.qcard .cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:40px;transition:opacity .4s}
.qcard .cover b{font:700 17px var(--body);letter-spacing:.28em;color:var(--rose)}
.qcard .cover span{font:italic 700 38px/1.15 var(--display)}
.qcard .cover i{font:600 19px var(--body);font-style:normal;color:var(--rose);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.qcard.open .cover{opacity:0;pointer-events:none}
.qcard.open .q{opacity:1;transform:none;padding-top:70px}
.blocks{position:absolute;left:660px;top:78px;width:870px}
.blk{display:flex;gap:34px;margin-bottom:56px}
.blk h3{font-size:34px;color:var(--red);font-weight:800}
.blk p{margin:12px 0 0;font-size:26px;line-height:1.46;color:var(--ink)}

/* summary */
.s-sum h2{position:absolute;left:90px;top:70px;font-size:84px;color:var(--cream)}
.s-sum .sub{position:absolute;left:92px;top:176px;font:italic 500 30px var(--body);color:var(--rose)}
.pts{position:absolute;left:92px;top:268px;width:560px}
.pt{display:flex;gap:28px;align-items:flex-start;margin-bottom:42px}
.pt b{display:block;font:800 31px var(--display);color:var(--cream)} .pt span{display:block;font-size:24px;margin-top:6px;color:#E9DFCB}
.s-sum .moral{position:absolute;left:92px;top:716px;width:560px;font:italic 800 34px/1.2 var(--display)}
.qgrid{position:absolute;left:740px;top:268px;display:grid;grid-template-columns:380px 380px;gap:26px}
.qg{height:268px;padding:34px;background:var(--red);border:0;text-align:left;color:var(--cream);transition:transform .3s}
.qg:nth-child(2),.qg:nth-child(3){background:var(--deep)}
.qg:hover{transform:translateY(-8px) rotate(-.6deg)}
.qg small{display:block;font:700 17px var(--body);letter-spacing:.3em;margin-bottom:22px}
.qg span{font:italic 500 32px/1.25 var(--display)}

/* conclusion */
.s-con .kick{position:absolute;left:100px;top:64px;color:var(--cream)}
.s-con h2{position:absolute;left:100px;top:110px;font-size:88px;line-height:1.05;color:var(--cream);width:1400px}
.s-con .lead{position:absolute;left:100px;top:300px;width:1300px;font:italic 500 38px/1.3 var(--display);color:var(--cream)}
.s-con .three{position:absolute;left:100px;top:480px;display:flex;gap:44px}
.s-con .c{width:432px;height:300px;background:var(--cream);color:var(--ink);padding:38px;box-shadow:0 16px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:30px}
.s-con .c .coin{--cr:var(--deep)}
.s-con .c p{margin:0;font:700 29px/1.3 var(--body)}

/* thanks */
.s-end h2{position:absolute;left:100px;top:170px;font-size:124px;color:var(--cream)}
.s-end .warn{position:absolute;left:104px;top:430px;width:760px;font:italic 800 52px/1.18 var(--display);color:var(--rose)}
.s-end .names{position:absolute;left:104px;bottom:92px;font:700 26px var(--body)}
.s-end .frame{position:absolute;right:120px;top:90px;--h:700px;transform:rotate(-2deg)}
.s-end .again{position:absolute;left:104px;top:690px;border:3px solid var(--cream);background:transparent;padding:16px 28px;font:700 22px var(--body);letter-spacing:.12em;transition:background .2s,color .2s}
.s-end .again:hover{background:var(--cream);color:var(--ink)}

/* HUD */
#hud{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 16px max(14px,env(safe-area-inset-bottom,0px));pointer-events:none}
#hud>*{pointer-events:auto}
.bar{display:flex;align-items:center;gap:14px;background:rgba(26,20,16,.82);backdrop-filter:blur(8px);border:1px solid rgba(243,232,210,.25);padding:8px 18px;border-radius:999px}
.dots{display:flex;gap:9px}
.dots button{width:11px;height:11px;border-radius:50%;border:0;padding:0;background:rgba(243,232,210,.35);transition:.25s}
.dots button.on{background:var(--cream);transform:scale(1.35)}
.nav{width:36px;height:36px;border-radius:50%;border:0;background:transparent;font-size:22px;line-height:1}
.nav:hover{background:rgba(243,232,210,.18)} .nav:disabled{opacity:.25;cursor:default}
.cnt{font:700 15px var(--body);letter-spacing:.14em;min-width:54px;text-align:center}
#tools{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:16px;z-index:20;display:flex;gap:10px}
#tools button{background:rgba(26,20,16,.82);border:1px solid rgba(243,232,210,.25);border-radius:999px;padding:9px 16px;font:700 14px var(--body);letter-spacing:.1em;backdrop-filter:blur(8px)}
.edge{position:fixed;top:0;bottom:0;width:90px;z-index:10;border:0;background:transparent;font-size:46px;color:var(--cream);opacity:0;transition:opacity .25s}
.edge:hover{opacity:1;background:linear-gradient(90deg,rgba(0,0,0,.28),transparent)}
.edge.l{left:0} .edge.r{right:0;transform:scaleX(-1)}
.edge[disabled]{display:none}

/* start gate */
#gate{position:fixed;inset:0;z-index:40;background:rgba(26,20,16,.94);display:grid;place-items:center;text-align:center;padding:24px;transition:opacity .6s}
#gate.off{opacity:0;pointer-events:none}
#gate .in{max-width:560px;display:flex;flex-direction:column;align-items:center;gap:22px}
#gate h1{font-size:clamp(44px,8vw,88px);line-height:.92;color:var(--cream)}
#gate p{margin:0;font-size:20px;line-height:1.5;color:#E9DFCB}
#gate .go{background:var(--red);border:0;color:var(--cream);font:800 22px var(--body);letter-spacing:.12em;padding:20px 38px;box-shadow:0 0 0 3px var(--cream)}
#gate .go:hover{background:var(--deep)}
#gate .quiet{background:none;border:0;color:var(--rose);font:600 17px var(--body);text-decoration:underline}
@media (max-height:520px){.bar{padding:4px 10px;gap:8px}.nav{width:28px;height:28px}.dots button{width:8px;height:8px}.cnt{display:none}#tools button{padding:6px 11px;font-size:12px}}
@media (max-width:760px){.edge{display:none} #tools button span{display:none}}
@media (max-width:480px){.bar{gap:4px;padding:6px 8px}.dots{gap:3px}.dots button{width:8px;height:8px}.cnt{font-size:12px;min-width:40px}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.slide .pop{opacity:1;transform:none}}
</style>

<main id="deck" aria-label="Gallery Walk slides"></main>

<button class="edge l" id="prevE" aria-label="Previous slide">&#10094;</button>
<button class="edge r" id="nextE" aria-label="Next slide">&#10094;</button>
<div id="tools">
  <button id="snd" aria-pressed="true" aria-label="Toggle sound">&#9835; <span>SOUND ON</span></button>

</div>
<div id="hud"><div class="bar">

  <span class="cnt" id="cnt">1 / 11</span>
  <button class="nav" id="next" aria-label="Next slide">&#8250;</button>
</div></div>

const members=[
 {k:"Oropesa",n:"OROPESA",tag:"THE PERSON",ang:"Money, identity and values",q:"Does money control people, or do people control how they use money?",
  b:["How money can influence a person's identity and life. The black silhouette suggests an identity hidden by the desire for money, the coins show wealth ruling thoughts and decisions, and the red background stresses money's influence.",
     "Money provides food, clothing, education and shelter, but some chase wealth and forget honesty, relationships, happiness and values. Students may feel a high-paying job is the only road to a good future.",
     "See money as a tool, not the purpose of life. Work hard while staying responsible, humble and respectful. Wealth should support our lives, not control them: our identity is shaped by values, actions and contribution."]},
 {k:"Pastolero",n:"PASTOLERO",tag:"SOCIETY",ang:"Wealth and social inequality",q:"What kind of society are we building if wealth opens doors for some while leaving others struggling just to find a way in?",
  b:["How the desire for wealth shapes decisions and creates unfair differences. The money around the figure becomes a barrier between those with many opportunities and those struggling to meet basic needs.",
     "Some Filipino families easily afford quality education and healthcare, while others cannot cover basic needs. A student's future can depend on family finances, even with ability and determination. Hard work matters, but not everyone starts equal.",
     "Wealth should not decide a person's worth or treatment. A fairer society recognizes the struggles of those with less, treats others with dignity and opens opportunities. A person's value is their character and impact on others."]},
 {k:"Peligrino",n:"PELIGRINO",tag:"GOVERNMENT",ang:"Corruption and the misuse of taxpayers' money",q:"How can we expect ordinary Filipinos to trust the government if they cannot see where their taxes go?",
  b:["Corruption in government: public money misused for personal gain. The silhouette among stacks of money shows power consumed by wealth, while the dark figure suggests the lack of transparency and accountability that lets corruption continue.",
     "As Filipinos, we pay taxes whenever we work, buy goods or use services, and expect quality education, healthcare, roads and transport in return. When public funds are misused, ordinary citizens suffer the consequences.",
     "Public money should never be treated as personal wealth. We need stronger accountability, transparent budgeting and strict consequences for corruption, so taxpayers receive the services they deserve."]},
 {k:"Yson",n:"YSON",tag:"THE COURTS",ang:"Justice that can be bought and sold",q:"If justice has a price tag, who is left to protect those who cannot afford it?",gavel:true,

 <div class="txt"><h2 class="rv" style="--i:0">The Artwork</h2><div class="sub rv" style="--i:1">What the four of us noticed first</div>
  <div class="row rv" style="--i:2">${coin(1)}<div><h3>A dark, faceless figure</h3><p>The black silhouette hides identity and accountability. For Yson, it is a judge, and the system itself is compromised.</p></div></div>

S.push(`<section class="slide red s-mean" aria-label="Two levels of meaning"><div class="stage">
 <div class="kick rv" style="--i:0">Reading the artwork</div>
 <h2 class="rv" style="--i:1">Two levels of meaning</h2>
 <div class="cols">
  <article class="mc lit rv" style="--i:2">
   <header>${coin(1,72)}<div><small>TEXTUAL MEANING</small><h3>Literal meaning</h3></div></header>
   <p>The artwork depicts a black silhouette of a person wearing a formal suit and tie against a red background. Instead of ordinary hair or a typical head covering, the figure has multiple rows of overlapping coins and dollar symbols ($) surrounding the head. These elements form a large and elaborate structure, emphasizing the prominent presence of money in the person’s appearance.</p>
   <div class="chips"><span>Black silhouette</span><span>Suit and tie</span><span>Red background</span><span>Rows of coins and $</span></div>
  </article>
  <article class="mc con rv" style="--i:3">
   <header>${coin(2,72)}<div><small>CONCEPTUAL MEANING</small><h3>Deeper meaning</h3></div></header>
   <p>The artwork symbolizes the influence of money on power, identity, and human behavior. The money surrounding the person’s head suggests that wealth has become deeply connected to how people think, make decisions, and exercise authority.</p>
   <p>It may also represent greed and corruption, particularly among individuals in positions of power, such as politicians, business leaders, and government officials. The formal suit symbolizes authority and leadership, while the money suggests that financial interests may influence decisions more than morality, responsibility, and public welfare.</p>
   <blockquote>Ultimately, the artwork raises an important question: Are people using money to improve society, or are they allowing money to control their principles and decisions?</blockquote>
  </article>
 </div></div></section>`);
S.push(`<section class="slide paper s-lens" aria-label="Four lenses"><div class="stage">
 <h2 class="rv" style="--i:0">Four lenses, one problem</h2>
 <div class="sub rv" style="--i:1">Our readings move from the person to society to government to the courts.</div>
 <div class="cards">${lens.map((l,i)=>`<button class="card ${i%2?'r':'k'} rv" style="--i:${i+2}" data-jump="${4+i}" aria-label="Go to ${l[1]}"><span class="coin" style="--d:78px">${i+1}</span><small>${l[0]}</small><b>${l[1]}</b><em>${l[2]}</em><span>${l[3]}</span></button>`).join("")}</div>
 <div class="foot rv" style="--i:6">The same problem appears at every level.</div>
 <div class="hint rv" style="--i:6">TAP A CARD TO JUMP TO THAT VIEW</div></div></section>`);
members.forEach((m,i)=>S.push(`<section class="slide paper s-mem" data-gavel="${m.gavel?1:0}" aria-label="${m.k}"><div class="stage">
 <div class="panel">
  <div class="kick rv" style="--i:0">Perspective ${i+1} of 4 &nbsp;·&nbsp; ${m.tag}</div>
  <h2 class="rv" style="--i:1">${m.n}</h2>
  <div class="ang rv" style="--i:2">${m.ang}</div>
  <button class="qcard rv" style="--i:3" data-q aria-expanded="false" aria-label="Reveal ${m.k}'s question">
   <span class="cover"><b>THE QUESTION</b><span>${m.k}<br>asks the room</span><i>TAP TO REVEAL</i></span>
   <span class="mark">&ldquo;</span><span class="q">${m.q}</span></button>
 </div>
 <div class="blocks">${m.b.map((t,j)=>`<div class="blk rv on-paper" style="--i:${j+2}">${coin(j+1,72)}<div><h3>${heads[j]}</h3><p>${t}</p></div></div>`).join("")}</div>
</div></section>`));
S.push(`<section class="slide ink s-sum" aria-label="Summary"><div class="stage">
 <h2 class="rv" style="--i:0">Summary: what we all noticed</h2>
 <div class="sub rv" style="--i:1">Three shared details, and four questions we ask the viewer</div>
 <div class="pts">
  <div class="pt rv" style="--i:2">${coin(1,70)}<div><b>A dark, faceless silhouette</b><span>identity and accountability hidden</span></div></div>
  <div class="pt rv" style="--i:3">${coin(2,70)}<div><b>Dollar coins crowding the figure</b><span>wealth taking over thoughts and decisions</span></div></div>
  <div class="pt rv" style="--i:4">${coin(3,70)}<div><b>A strong red background</b><span>the weight of money's influence</span></div></div>
 </div>
 <div class="moral rv" style="--i:5">Wealth can overshadow identity, responsibility and fairness.</div>
 <div class="qgrid">
  ${[["OROPESA","Does money control us, or do we control it?"],["PASTOLERO","Should wealth decide a person's opportunities and treatment?"],["PELIGRINO","Where does public money go?"],["YSON","Who protects those who cannot afford justice?"]].map((q,i)=>`<button class="qg rv" style="--i:${i+3}" data-ping><small>${q[0]}</small><span>${q[1]}</span></button>`).join("")}
 </div></div></section>`);
S.push(`<section class="slide red s-con" aria-label="Shared conclusion"><div class="stage">
 <div class="kick rv" style="--i:0">Our shared conclusion</div>
 <h2 class="rv" style="--i:1">Wealth is not the problem in itself.</h2>
 <div class="lead rv" style="--i:2">The problem begins when it replaces honesty, character and service to others as the measure of a person's worth, or of an institution's integrity.</div>
 <div class="three">${["Wealth should support our lives and society, not control them.","Those who hold public trust must be held accountable.","Fairness, justice and dignity must be open to every Filipino, rich or poor."].map((t,i)=>`<div class="c rv" style="--i:${i+3}">${coin(i+1,74)}<p>${t}</p></div>`).join("")}</div>
</div></section>`);
S.push(`<section class="slide ink s-end" aria-label="Thank you"><div class="stage">
 <h2 class="rv" style="--i:0">Thank you</h2>
 <div class="warn rv" style="--i:2">CORRUPTION KILLS. THINK ABOUT THAT.</div>
 <button class="again rv" style="--i:3" data-jump="0">&#8634; REPLAY FROM THE START</button>
 <div class="names rv" style="--i:4">Peligrino &nbsp;·&nbsp; Pastolero &nbsp;·&nbsp; Oropesa &nbsp;·&nbsp; Yson</div>
 <div class="pop">${frame(700)}</div></div></section>`);

const deck=document.getElementById("deck");
deck.innerHTML=S.join("");
const slides=[...deck.querySelectorAll(".slide")], N=slides.length;
const dots=document.getElementById("dots");
dots.innerHTML=slides.map((_,i)=>`<button aria-label="Slide ${i+1}" data-go="${i}"></button>`).join("");
const rain=document.getElementById("rain");
for(let i=0;i<16;i++){const c=document.createElement("i");c.textContent="$";c.style.left=(Math.random()*1560)+"px";c.style.animationDuration=(9+Math.random()*9)+"s";c.style.animationDelay=(-Math.random()*14)+"s";c.style.transform=`scale(${.6+Math.random()*1.1})`;rain.appendChild(c)}

/* scale stage to viewport */
function fit(){const r=document.documentElement,W=innerWidth,H=innerHeight;r.style.setProperty("--s",Math.min(W/1600,(H-(H<520?56:0))/900));r.style.setProperty("--hud",(H<520?28:0)+"px")}
addEventListener("resize",fit);fit();

/* ---------- sound (synthesised, no files) ---------- */
let ctx=null,master=null,soundOn=false;
function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination)}catch(e){return null}}if(ctx.state==="suspended")ctx.resume();return ctx}
function env(g,t,a,d,p){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function tone(f,t,o={}){const{type="sine",a=.005,d=.3,peak=.2,f2}=o,c=ctx,os=c.createOscillator(),g=c.createGain();os.type=type;os.frequency.setValueAtTime(f,t);if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+a+d);env(g,t,a,d,peak);os.connect(g);g.connect(master);os.start(t);os.stop(t+a+d+.05)}
function noise(t,dur,o={}){const{f0=500,f1=2500,q=1,peak=.15,type="bandpass"}=o,c=ctx,n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=c.createGain();env(g,t,dur*.3,dur*.7,peak);s.connect(f);f.connect(g);g.connect(master);s.start(t)}
const SFX={
 clink(dl=0){if(!soundOn||!ac())return;const t=ctx.currentTime+dl;tone(2637,t,{type:"triangle",d:.35,peak:.12});tone(3951,t+.01,{d:.25,peak:.07});tone(1975,t+.07,{type:"triangle",d:.4,peak:.08})},
 whoosh(){if(!soundOn||!ac())return;noise(ctx.currentTime,.5,{f0:300,f1:2600,q:.8,peak:.13})},
 gavel(){if(!soundOn||!ac())return;const t=ctx.currentTime;[0,.3].forEach(o=>{tone(190,t+o,{f2:50,d:.28,peak:.55,a:.002});noise(t+o,.09,{f0:3200,f1:700,peak:.25})})},
 chord(){if(!soundOn||!ac())return;const t=ctx.currentTime;[220,277.2,329.6,440].forEach((f,i)=>tone(f,t+i*.05,{type:"triangle",a:.5,d:2.2,peak:.07}))},
 chime(){if(!soundOn||!ac())return;const t=ctx.currentTime;[523.3,659.3,784,1046.5,1318.5].forEach((f,i)=>tone(f,t+i*.14,{d:1.1,peak:.1}))},
 rise(){if(!soundOn||!ac())return;const t=ctx.currentTime;tone(330,t,{type:"triangle",f2:990,d:.45,peak:.1});SFX.clink(.4)},
 flurry(){if(!soundOn||!ac())return;[0,.09,.17,.3,.39].forEach((d,i)=>{const t=ctx.currentTime+d;tone(2300+i*260,t,{type:"triangle",d:.3,peak:.1});tone(3700+i*190,t+.01,{d:.2,peak:.05})})}
};
const sndBtn=document.getElementById("snd");
function setSound(on){soundOn=on;sndBtn.setAttribute("aria-pressed",on);sndBtn.querySelector("span").textContent=on?"SOUND ON":"SOUND OFF";if(on)ac()}
sndBtn.onclick=()=>{setSound(!soundOn);if(soundOn)SFX.clink()};

/* ---------- navigation ---------- */
let cur=-1;
function go(i){i=Math.max(0,Math.min(N-1,i));slides[i].scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",inline:"start",block:"nearest"})}
function activate(i){
  if(i===cur)return;const first=cur===-1;cur=i;
  slides.forEach((s,k)=>s.classList.toggle("on",k===i));
  dots.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("on",k===i));
  document.getElementById("cnt").textContent=(i+1)+" / "+N;
  ["prev","prevE"].forEach(id=>document.getElementById(id).disabled=i===0);
  ["next","nextE"].forEach(id=>document.getElementById(id).disabled=i===N-1);
  if(first)return;
  SFX.whoosh();
  if(i===N-2){SFX.chord()} else if(i===N-1){SFX.chime()} else {SFX.clink(.14)}
}
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.6)activate(slides.indexOf(e.target))})},{root:deck,threshold:[.6]});
slides.forEach(s=>io.observe(s));
activate(0);

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(+g.dataset.go);return}
  const j=e.target.closest("[data-jump]");if(j){SFX.clink();go(+j.dataset.jump);return}
  const c=e.target.closest("[data-coin]");if(c){c.classList.remove("spin");void c.offsetWidth;c.classList.add("spin");if(!c.closest("[data-jump]"))SFX.clink();return}
  const q=e.target.closest("[data-q]");if(q){const open=q.classList.toggle("open");q.setAttribute("aria-expanded",open);if(open){q.closest(".slide").dataset.gavel==="1"?SFX.gavel():SFX.rise()}return}
  const p=e.target.closest("[data-ping]");if(p){SFX.clink();return}
});
document.getElementById("prev").onclick=document.getElementById("prevE").onclick=()=>go(cur-1);
document.getElementById("next").onclick=document.getElementById("nextE").onclick=()=>go(cur+1);
addEventListener("keydown",e=>{
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)&&!e.target.closest("button")){e.preventDefault();go(cur+1)}
  else if(["ArrowRight","PageDown"].includes(e.key)){e.preventDefault();go(cur+1)}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==="Home"){go(0)} else if(e.key==="End"){go(N-1)}
  else if(e.key==="m"||e.key==="M"){sndBtn.click()}
  else if(e.key==="f"||e.key==="F"){document.getElementById("fs").click()}
});
let wl=0;
deck.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&Math.abs(e.deltaY)>25){e.preventDefault();const n=Date.now();if(n-wl>650){wl=n;go(cur+(e.deltaY>0?1:-1))}}},{passive:false});
document.getElementById("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};

/* opens directly: sound is on and unlocks on the first tap, key press or swipe */
soundOn=true;sndBtn.setAttribute("aria-pressed",true);sndBtn.querySelector("span").textContent="SOUND ON";
["pointerdown","touchstart","keydown"].forEach(ev=>addEventListener(ev,()=>ac(),{once:true,passive:true}));
let tp=null;addEventListener("touchstart",e=>{tp=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
addEventListener("touchend",e=>{if(!tp||!document.documentElement.classList.contains("rot"))return;const t=e.changedTouches[0],dx=t.clientX-tp[0],dy=t.clientY-tp[1];tp=null;if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx)*1.2)go(cur+(dy<0?1:-1))},{passive:true});
</script>
</body></html>
